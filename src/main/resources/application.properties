spring.application.name=GameArena

spring.datasource.url=jdbc:h2:file:./data/gamearena
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-numbers-for-enums=true

# Incluye el motivo de los errores HTTP para mostrarlo en el cliente.
server.error.include-message=always
